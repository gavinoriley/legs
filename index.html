        /* === FLOATING HUD NAVBAR (Screenshot UI Inspired) === */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none; /* Allows canvas interactions beneath if needed */
        }
        .nav-left-group, .nav-right-group {
            display: flex;
            align-items: center;
            gap: 30px;
            pointer-events: auto; /* Re-enables links */
        }
        .navbar a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 20px;
            letter-spacing: 0.05em;
            transition: color 0.25s ease;
        }
        .navbar a:hover {
            color: #ffffff;
        }

        /* Solid Pill CTA Button Layout mimicking 'Get Tickets' */
        .navbar a.buy-game-link {
            color: #ffffff;
            background-color: #b62121; /* High-intensity cinematic red */
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: normal;
            font-size: 18px;
            letter-spacing: 0.05em;
            transition: background-color 0.25s ease, transform 0.25s ease;
        }
        .navbar a.buy-game-link:hover {
            background-color: #d42d2d;
            transform: scale(1.03);
        }

        /* Dev Room Pulsing Effect */
        .navbar a.dev-room-link {
            position: relative;
            animation: demonic-glow-pulse 2s ease-in-out infinite;
        }
        @keyframes demonic-glow-pulse {
            0%, 100% { text-shadow: 0 0 6px #ff4444, 0 0 12px #ff0000; color: #ff5555; }
            50% { text-shadow: 0 0 14px #ff4444, 0 0 25px #ff0000; color: #ffffff; }
        }

        /* === UNBROKEN SEAMLESS CONTENT LAYOUT === */
        #wrapper {
            width: 100%;
        }
        main id="container" {
            width: 100%;
        }
        section {
            width: 100%;
            position: relative;
            background-color: #000000;
            display: block;
            line-height: 0; /* Eradicates unwanted gaps between vertical images */
        }
        section img, section iframe {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Hero Container Area */
        .title-section {
            position: relative;
        }
        
        /* Floating Interface Pill Actions Over Hero Image */
        .hero-ui-overlay {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            z-index: 10;
            line-height: normal; /* Resating default layout flow inside button container */
        }
        
        /* Outlined Action Capsular Buttons inspired by 'Watch Trailer' style */
        .ui-pill-btn {
            background: rgba(0, 0, 0, 0.4);
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            padding: 12px 28px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: border-color 0.25s ease, background-color 0.25s ease;
            white-space: nowrap;
        }
        .ui-pill-btn:hover {
            border-color: #b62121;
            background: rgba(182, 33, 33, 0.15);
        }

        /* Seamless Infinite Carousel Stretch */
        .carousel {
            width: 100%;
            overflow: hidden;
            position: relative;
            background-color: #000000;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .carousel-inner {
            display: flex;
            width: max-content;
            animation: scroll 40s linear infinite;
        }
        .carousel-inner img {
            width: calc(100vw / 3);
            height: auto;
            object-fit: cover;
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Video Section Widescreen Frame */
        .video-section iframe {
            aspect-ratio: 16 / 9;
            border: none;
        }

        /* === MINIMAL HUD UTILITY FOOTER === */
        .business-section {
            background-color: #000000;
            padding: 60px 40px;
            line-height: normal;
        }
        .business-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        .business-links a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 16px;
            letter-spacing: 0.05em;
            transition: color 0.25s ease;

        }

            font-size: 14px;

        /* === MOBILE HUD RESPONSIVENESS === */
        @media screen and (max-width: 768px) {
            .navbar {
                padding: 16px 20px;

            .nav-left-group {

            }
            .navbar a {

            }

            }
            .hero-ui-overlay {
                bottom: 15%;
                width: 90%;
                justify-content: center;
                gap: 10px;
            }
            .ui-pill-btn {
                padding: 10px 20px;
                font-size: 15px;
            }
            .carousel-inner img {
                width: calc(100vw / 2);
            }
            .business-links {
                gap: 20px;
            }
        }
